# Polaris 插件目录分类词表（ADR-0123）
#
# 四个维度与取值对齐 Claude 桌面版目录（主题 / 部门 / 行业 / 日常生活）；插件、技能、连接器共用这一套。
# 由 polaris 仓库 tools/catalog_overlay_gen.go 读取：LLM 只能从 values 中选值，upstream_map 是上游
# category 字符串到取值的确定性映射（LLM 漏选时兜底）。
#
# 维护规则：
#   1. 取值 ID 一经发布不得改名、不得复用（守护进程与前端按 ID 识别）；要废弃就删除该行，生成器下一轮自然不再产出。
#   2. 新增取值：在对应维度下加一行，en / zh 必填；下一轮只影响新翻译的条目（旧条目要重分类需清空 machine.json 对应行）。
#   3. upstream_map 的值必须是本文件已有的取值 ID（生成器启动时校验，不通过直接失败）。
#   4. 状态类筛选（Polaris 官方 / 已认证 / 社区 / 已安装 / 有中文 / 最新）由守护进程与前端计算，不在本文件。
version: 1

facets:
  topic:      { zh: 主题,     required: true, max: 3 }
  department: { zh: 部门,     max: 2 }
  industry:   { zh: 行业,     max: 2 }
  life:       { zh: 日常生活, max: 2 }

