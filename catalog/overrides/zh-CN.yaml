# 人工校对（ADR-0123）：覆盖机器翻译与分类，优先级最高，生成器每轮都在机器结果之上重新叠加。
#
# 格式：entries 下以目录条目 ID 为键（= Polaris 插件页条目 ID，形如 <市场ID>/<插件名>），只写要覆盖的字段：
#   name / summary / description：空串或不写 = 不覆盖
#   topic / department / industry / life：不写 = 不覆盖；写 [] = 覆盖为空；取值必须在 taxonomy.yaml 中
# 删除某条覆盖后，下一轮自动恢复为机器结果。ID 写错（不存在的条目）会被忽略。
#
# Polaris 官方插件：英文以各插件 .codex-plugin/plugin.json 为准，中文以这里为准，两边内容须对应。
entries:
  polarisagi/polaris-plugins-official/polaris-computer-use:
    name: 电脑操控
    summary: 用键鼠和截图操作任意桌面应用，包括聊天软件
    description: |-
      让 AI Agent 通过图形界面自动操作任意桌面应用：启动并使用电脑上安装的各类软件（包括各种聊天软件），与界面交互，控制鼠标键盘，并借助视觉 OCR 与系统原生接口理解屏幕内容。基于 Python 实现，支持 macOS、Windows、Linux。
    topic: [automation-workflows]
    department: []
    industry: []
    life: []
  polarisagi/polaris-plugins-official/polaris-browser-bridge:
    name: 浏览器桥接
    summary: 一键设置 Chrome 扩展并自动配对，供浏览器与社交插件使用
    description: |-
      Polaris 官方浏览器扩展（Polaris Browser Bridge）的唯一来源与设置入口：一键同步扩展到稳定目录、注册 Native Messaging 宿主以自动配对令牌、提供状态查询与令牌轮换。浏览器操作与社交平台插件依赖本插件。

      需要：Python ≥3.14、Chrome。
    topic: [websites, automation-workflows]
    department: []
  polarisagi/polaris-plugins-official/polaris-browser-use:
    name: 浏览器操作
    summary: 复用你已登录的 Chrome 阅读和操作网页，省 token
    description: |-
      Polaris 官方通用浏览器插件。复用你日常已登录的 Chrome 会话，提供省 token 的正文读取与 DOM 快照交互；严格在 Polaris 自建的窗口内操作，不打扰你的其他标签页。已知社交平台请使用「社交平台」插件。

      需要：Python ≥3.14、Chrome。
    topic: [websites, automation-workflows]
  polarisagi/polaris-plugins-official/polaris-knowledge-base:
    name: 资料库
    summary: 把采集结果和摘要存成可检索的 Markdown 资料库
    description: |-
      把采集结果与摘要落成带 YAML 元信息头的 Markdown 文件（默认 ~/Polaris/Vault，兼容 Obsidian），按 URL 去重，提供保存、列表、全文检索、阅读、打标签与整理。写入严格限定在资料库目录内，内核会把该目录同步进知识库检索。

      安全：路径解析后必须位于资料库内。需要：Python ≥3.14。
    topic: [notes-memory, files-documents]
    life: [research]
  polarisagi/polaris-plugins-official/polaris-social:
    name: 社交平台
    summary: 读取知乎、X、微博、小红书内容并跨平台发帖互动
    description: |-
      Polaris 官方社交平台插件。读：复用你已登录的 Chrome，按站点配方优先拦截页面接口数据（几乎不耗 token），支持知乎、X、微博、小红书的搜索、热榜、动态与正文读取。写：在 Twitter/X、微博、小红书、抖音、公众号、Instagram、Facebook 等平台发布、删除、评论、点赞与私信，并可读取各平台的合规规范。读写共享按平台的限速与风控熔断。

      需要：Python ≥3.14、Chrome。
    topic: [email-messages]
    department: [marketing]
    life: [social-media, news]
