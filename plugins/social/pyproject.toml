[project]
name = "polaris-social"
version = "3.0.0"
description = "Polaris plugin: read (search/hot/feed/read) and write (post/interact) for social platforms with shared per-platform rate limiting"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.30.0,<2",
    "patchright>=1.55",
    "playwright>=1.40.0",
    "pydantic>=2.9",
    "trafilatura>=2.0",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
