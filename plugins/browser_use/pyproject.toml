[project]
name = "browser-use"
version = "0.1.0"
description = "Polaris MCP plugin: Browser automation via DOM extraction and Playwright for precise, ID-based web element interaction."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "mcp>=1.27.2,<2",
    "patchright>=1.55",
    "playwright>=1.40.0",
    "trafilatura>=2.0",
    "pydantic>=2.9",
    "websockets>=13.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
